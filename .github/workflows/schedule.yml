name: Daily Office Check-In

on:
  schedule:
    # This runs at 6:45 AM UTC, which is exactly 12:15 PM IST (Indian Standard Time). 
    - cron: '45 6 * * *'
  
  workflow_dispatch: # This allows you to click a button to run it manually anytime!

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium --with-deps

      - name: Run Automation Script
        run: python playwright_main.py
